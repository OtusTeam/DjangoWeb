#volumes:
#  static:
#  db-data:

services:
  db:
    image: postgres
#    restart: always
    expose:
      - 5432
#    ports:
#      - 5432:5432
#    volumes:
#      - db-data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 6
  backend:
#    image: findsimilar/demo
#    restart: always
    build:
      context: .
#    expose:
#      - 8000
    ports:
      - 8000:8000
#    volumes:
#      - static:/static/
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      DB_HOST: "${DB_HOST}"
    command: bash -c "
      python manage.py migrate
      && python manage.py fill_db
      && gunicorn zoo.wsgi -b 0.0.0.0:8000
      "
    depends_on:
      db:
        condition: service_healthy
  frontend:
#     image: findsimilar/demo-front-end
#    restart: always
    build:
      context: ./frontend
    ports:
      - 80:80