{% block title %}Add product{% endblock %}

{% block body %}

        <form action="{% url 'shop_app:create_product' %}" method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit">Create</button>
        </form>
{% endblock %}
